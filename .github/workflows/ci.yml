name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The frontmatter is what decides whether the skill loads and triggers at all.
      - name: SKILL.md frontmatter is valid
        run: python3 scripts/check_skill.py

      # This repository is public: no real AMS NetId, IP or MAC address (see CLAUDE.md).
      - name: no real network identities committed
        run: python3 scripts/check_private.py

      # Vendor ESI files are the vendor's copyright; fixtures here are hand-written for a
      # fictional vendor (see CLAUDE.md).
      - name: ESI files are synthetic
        run: |
          bad=$(git grep -l '<EtherCATInfo' -- '*.xml' '*.XML' | while read -r f; do
            grep -q '<Name>Example Vendor</Name>' "$f" || echo "$f"; done)
          [ -z "$bad" ] || { echo "ESI files without vendor 'Example Vendor':"; echo "$bad"; exit 1; }

      # Manuals and specs are copyrighted and must never land here (see CLAUDE.md).
      - name: no PDFs committed
        run: |
          found=$(git ls-files '*.pdf' '*.PDF')
          [ -z "$found" ] || { echo "PDF files committed:"; echo "$found"; exit 1; }
